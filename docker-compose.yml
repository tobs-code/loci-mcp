services:
  postgres:
    build: .
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: geheim
      POSTGRES_USER: memory
      POSTGRES_DB: memory
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    build: ./inference
    ports:
      - "8001:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY fehlt (siehe .env.example)}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

  loci-mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8766:8766"
    environment:
      MEMORY_DATABASE_URL: postgresql://memory:geheim@postgres:5432/memory
      MEMORY_INFERENCE_URL: http://inference:8000
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8766"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost', 8766), timeout=5); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      inference:
        condition: service_healthy

volumes:
  pgdata:
