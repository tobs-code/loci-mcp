services:
  postgres:
    build: .
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_DB: ${POSTGRES_DB:-memory}
    ports:
      # Loopback only: the database is an internal service, not a public API.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    build:
      context: ./inference
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    ports:
      # Loopback only: the MCP server reaches inference over the compose
      # network, so the host does not need an externally reachable port.
      - "127.0.0.1:8001:8000"
    environment:
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-mixedbread-ai/mxbai-rerank-base-v1}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-256}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

  loci-mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      # Loopback only by default. To reach the server from another machine,
      # publish it explicitly ("8766:8766") AND keep MCP_AUTH_TOKEN set.
      - "127.0.0.1:8766:8766"
    environment:
      # Special characters in the password must be percent-encoded for a URL,
      # or set MEMORY_DATABASE_URL explicitly.
      MEMORY_DATABASE_URL: postgresql://${POSTGRES_USER:-memory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-memory}
      MEMORY_INFERENCE_URL: http://inference:8000
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8766"
      # Required: the HTTP transport exposes every tool, including the
      # destructive maintenance ones. The server refuses to start on a
      # non-loopback bind without this token.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      MCP_ALLOW_INSECURE_HTTP: ${MCP_ALLOW_INSECURE_HTTP:-false}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_MODEL: ${RERANK_MODEL:-mixedbread-ai/mxbai-rerank-base-v1}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-256}
      RERANK_TOP_K: ${RERANK_TOP_K:-10}
      RERANK_TRIGGER_SCORE: ${RERANK_TRIGGER_SCORE:-0.85}
      RERANK_TRIGGER_MARGIN: ${RERANK_TRIGGER_MARGIN:-0.10}
      RERANK_ALWAYS: ${RERANK_ALWAYS:-false}
      RERANK_LOGIT_BIAS: ${RERANK_LOGIT_BIAS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost', 8766), timeout=5); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      inference:
        condition: service_healthy

volumes:
  pgdata:
